name: Docker Build & Deploy

on:
  push:
    branches: ["main", "hidup-jokowi"]

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Memberikan izin agar GitHub bisa menulis paket Docker (GHCR)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Menggunakan huruf kecil (lowercase) agar tidak error
          tags: |
            ghcr.io/${{ github.repository_owner }}/batam-campus-expo:latest
            ghcr.io/${{ github.repository_owner }}/batam-campus-expo:${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          # Memanggil data dari Secrets yang Anda isi tadi
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/Batam-Campus-Expo
            
            sudo docker compose exec -T app php artisan storage:link
            sudo chown -R 33:33 /home/ubuntu/Batam-Campus-Expo/storage
            sudo chmod -R 775 /home/ubuntu/Batam-Campus-Expo/storage
            sudo chown -R 33:33 /home/ubuntu/Batam-Campus-Expo/public
            sudo chmod -R 775 /home/ubuntu/Batam-Campus-Expo/public
            sudo mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache
            sudo mkdir -p public/images/payment_proof

            sudo git fetch --all
            sudo git reset --hard origin/main
            sudo docker compose exec -T app php artisan storage:link

            sudo docker compose exec -T app npm install
            sudo docker compose exec -T app npm run build
            
            # FIX 1: Mengatasi "dubious ownership" agar bisa git pull
            sudo git config --global --add safe.directory /home/ubuntu/Batam-Campus-Expo
            sudo git pull origin ${{ github.ref_name }}

            # Login ke GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Update container
            sudo docker compose pull
            sudo docker compose up -d
            
            # FIX 2: Mengatasi "Failed opening autoload.php"
            # Kita jalankan composer install di dalam container jika vendor kosong
            sudo docker compose exec -T app composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            sudo docker compose exec -T app php artisan optimize:clear

            # Jalankan perintah standar Laravel
            sudo docker compose exec -T app php artisan migrate --force
            sudo docker compose exec -T app php artisan optimize
            sudo docker image prune -f