name: CI/CD Pipeline

on:
  push:
    branches: ["main", "hidup-jokowi"]
  pull_request:
    branches: ["main", "hidup-jokowi"]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: bce_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath, gd, zip, redis
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
          # Memastikan folder storage ada dan bisa ditulis
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/app
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          chmod -R 777 storage bootstrap/cache

      - name: Install NPM dependencies and Build
        run: |
          npm install
          npm run build

      - name: Run Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bce_test
          DB_USERNAME: root
          DB_PASSWORD: ""
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test --env=testing

  cd:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hidup-jokowi')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: cd
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hidup-jokowi')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Pindah ke folder proyek di VPS
            cd /home/ubuntu/Batam-Campus-Expo
            
            # Update file terbaru dari Git (opsional jika docker-compose.yml berubah)
            git pull origin ${{ github.ref_name }}

            # Login ke GHCR agar bisa pull image private
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull image terbaru yang baru di-push oleh job 'cd'
            docker compose pull
            
            # Restart container
            docker compose up -d
            
            # Jalankan migrasi dan optimasi di dalam container
            # Pastikan nama service adalah 'app' (cek docker-compose.yml)
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize
            docker compose exec -T app php artisan view:cache