version: "3.8"

services:
  # PHP Service
  app:
    image: ghcr.io/aliffajriadi/batam-campus-expo:latest
    container_name: bce-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./.env:/var/www/.env
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
      # Kita buat volume khusus untuk folder public agar sinkron ke Nginx
      - bce-public-data:/var/www/public
    networks:
      - bce-network

  # Nginx Service
  web:
    image: nginx:alpine
    container_name: bce-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
      # Nginx membaca volume yang sama dengan App (SANGAT PENTING)
      - bce-public-data:/var/www/public
    networks:
      - bce-network
    depends_on:
      - app

  # Database Service
  db:
    image: mariadb:10.11
    container_name: bce-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bce}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-root}
    volumes:
      - bce-db-data:/var/lib/mysql
    networks:
      - bce-network

  # Redis Service
  redis:
    image: redis:alpine
    container_name: bce-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - bce-redis-data:/data
    networks:
      - bce-network

networks:
  bce-network:
    driver: bridge

volumes:
  bce-db-data:
    driver: local
  bce-redis-data:
    driver: local
  # Definisikan volume untuk sinkronisasi file public
  bce-public-data:
    driver: local